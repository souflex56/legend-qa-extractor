# =============================================================================
# Legend QA Extractor 配置示例 - 不同性能模式
# =============================================================================
# 🎯 当前激活：串行处理模式（最大稳定性）
# 🔄 可通过修改配置或环境变量切换到其他模式
# =============================================================================

# ==================== 文件配置 ====================
pdf_filename: "uploaded.pdf"
output_filename: "output_final_qa.jsonl"
output_dir: "output"

# ==================== 模型配置 ====================
model_name: "qwen2.5:7b-instruct"
ollama_host: "http://localhost:11434"
temperature: 0.1

# ==================== 🎯 当前激活：串行处理模式 ====================
# 适用场景：调试、稳定性优先、Ollama资源有限

# 性能配置 - 串行模式（最稳定）
batch_size: 1           # 🔄 串行处理，一次只处理一个block
max_workers: 1          # 🔄 单线程，确保完全串行

# 文本处理配置
max_block_size: 1000    # 稍小的block，减少单次处理时间
min_block_size: 150     # 保持较小最小值，避免丢失短内容
extract_ratio: 1.0      # 处理所有blocks

# QA过滤优化
enable_qa_filter: true  # 🚀 启用过滤，跳过50-70%无关blocks
qa_allowance_ratio: 1.1

# 智能分块配置
enable_sliding_context: true   # 保持上下文连续性
enable_llm_anchor: false       # 关闭以提速（可选开启提升质量）
anchor_keywords_count: 2

# Token管理
max_prompt_tokens: 6000
enable_token_monitoring: true

# 日志配置
log_level: "INFO"
enable_success_log: true
enable_error_log: true

# 已知问题前缀
known_prefixes:
  - "网友"
  - "记者"
  - "问"
  - "提问者"
  - "主持人"
  - "Q"
  - "观众"
  - "面试官"
  - "嘉宾"

# =============================================================================
# 🔧 其他性能模式配置说明（注释形式）
# =============================================================================

# ==================== ⚡ 平衡模式配置 ====================
# 适用场景：日常使用、普通服务器、性能与稳定性平衡
# 
# 要切换到平衡模式，请修改上述配置为：
# batch_size: 3           # 小批次处理
# max_workers: 2          # 适中并发
# max_block_size: 1200    # 标准block大小
#
# 或使用环境变量：
# export BATCH_SIZE=3 && export MAX_WORKERS=2
#
# 预期性能：~2-3小时（相比串行模式2-3倍提速）

# ==================== 🚀 高性能模式配置 ====================
# 适用场景：高性能服务器、大批量处理、速度优先
#
# 要切换到高性能模式，请修改上述配置为：
# batch_size: 8           # 大批次处理
# max_workers: 4          # 高并发
# max_block_size: 1500    # 更大block，减少总请求数
# min_block_size: 200     # 稍大最小值
# temperature: 0.05       # 更低温度，提高一致性
# max_prompt_tokens: 8000 # 更大token限制
# enable_success_log: false  # 关闭详细日志提速
#
# 或使用环境变量：
# export BATCH_SIZE=8 && export MAX_WORKERS=4 && export MAX_BLOCK_SIZE=1500
#
# 预期性能：~30-60分钟（相比串行模式5-10倍提速）

# =============================================================================
# 🎯 配置选择指南和重要说明
# =============================================================================

# 📌 模式选择建议：
# 🟢 新用户/调试：当前串行配置 - 最稳定，适合学习和调试
# 🟡 日常使用：平衡模式配置 - 性能与稳定性的最佳平衡
# 🔴 高性能需求：高性能模式配置 - 速度最快，需要充分测试

# ⚠️ 重要澄清 - 关于并行处理和质量：
# 
# 1. 📝 并行 ≠ 超长prompt！
#    - 每个block都是独立处理的，有自己的prompt
#    - batch_size只控制同时处理的block数量
#    - 每个prompt的长度和内容完全相同
#    - 模型看到的上下文信息没有任何变化
#
# 2. 🎯 质量不受影响：
#    - batch_size=1和batch_size=8的质量完全相同
#    - 每个block使用相同的prompt模板和参数
#    - 只是处理速度不同，质量保持一致
#
# 3. 🚀 并行处理原理：
#    - 串行：Block1 → 完成 → Block2 → 完成 → Block3...
#    - 并行：Block1,2,3同时处理 → 都完成 → Block4,5,6同时处理...
#    - 每个block仍然独立调用LLM，不会合并

# =============================================================================
# 🚀 环境变量快速切换命令
# =============================================================================
#
# 🔄 串行模式（当前）：
# export BATCH_SIZE=1 && export MAX_WORKERS=1
#
# ⚡ 平衡模式：
# export BATCH_SIZE=3 && export MAX_WORKERS=2
#
# 🚀 高性能模式：
# export BATCH_SIZE=8 && export MAX_WORKERS=4
#
# 🔧 重置为配置文件设置：
# unset BATCH_SIZE MAX_WORKERS
#
# =============================================================================

# ==================== 📊 性能预期对比 ====================
#
# 基于393个blocks的测试数据：
#
# 🔄 串行模式：
#   - 处理时间：~4-6小时
#   - 内存占用：最低（单线程）
#   - 稳定性：最高
#   - 适用场景：调试、生产环境重要文档
#
# ⚡ 平衡模式：
#   - 处理时间：~2-3小时（2-3倍提速）
#   - 内存占用：中等
#   - 稳定性：高
#   - 适用场景：日常批量处理
#
# 🚀 高性能模式：
#   - 处理时间：~30-60分钟（5-10倍提速）
#   - 内存占用：较高
#   - 稳定性：需要测试
#   - 适用场景：高性能环境、紧急任务
#
# ============================================================================= 