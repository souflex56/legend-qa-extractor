# =============================================================================
# Legend QA Extractor 配置文件
# =============================================================================
# 本文件包含 QA 提取系统的所有配置项
# 支持环境变量覆盖，格式：export CONFIG_NAME=value
# =============================================================================

# ==================== 文件配置 (File Configuration) ====================
# 必填配置项 - 输入输出文件路径

# PDF 文件路径 (必填)
# 支持绝对路径或相对路径，默认为当前目录下的 uploaded.pdf
pdf_filename: "uploaded.pdf"

# 输出文件名 (必填)
# 生成的 QA 对将保存到此文件，格式为 JSONL
output_filename: "output_final_qa_chunk_g.jsonl"

# 输出目录 (必填)
# 所有输出文件（包括日志）将保存到此目录
output_dir: "output"

# ==================== 模型配置 (Model Configuration) ====================
# 必填配置项 - LLM 模型和连接设置

# Ollama 模型名称 (必填)
# 推荐模型：qwen2.5:7b-instruct, qwen2.5:14b-instruct, llama2:13b-chat
model_name: "qwen2.5:7b-instruct"

# Ollama 服务器地址 (必填)
# 如果 Ollama 运行在其他机器上，请修改此地址
ollama_host: "http://localhost:11434"

# 模型温度参数 (可选，默认: 0.1)
# 控制输出的随机性：0.0 = 最一致，1.0 = 最创造性
# 建议范围：0.0 - 0.3
temperature: 0.1

# ==================== 文本处理配置 (Text Processing Configuration) ====================
# 核心配置项 - 控制文本分块和处理策略

# 最大块大小 (必填，默认: 1200)
# 🚀 优化后：大幅减小块大小以提高处理速度
# 单个文本块的最大字符数，更大的块提供更多上下文但处理更慢
max_block_size: 800

# 最小块大小 (必填，默认: 150)
# 🚀 优化后：适当减小最小块大小，避免丢失短但有价值的QA对
# 单个文本块的最小字符数，小于此值的块将被丢弃
min_block_size: 150

# 提取比例 (必填，默认: 1.0)
# 🚀 优化后：先用较小比例测试，确保能正常提取
# 处理块的比例，范围 0.0-1.0
# 1.0 = 处理所有块，0.1 = 处理 10% 的块
extract_ratio: 0.1

# ==================== 智能分块配置 (Smart Block Processing) ====================
# 高级配置项 - 智能文本分块功能

# QA 容错比例 (可选，默认: 1.1)
# 允许的 QA 对数量超出预期比例，用于处理复杂文档
qa_allowance_ratio: 1.1

# 启用滑动上下文 (可选，默认: true)
# 🚀 保持启用：滑动上下文对质量提升明显，性能影响很小
# 在分块时保持上下文连续性，提高 QA 提取质量
enable_sliding_context: true

# 启用 LLM 锚点 (可选，默认: true)
# 🚀 暂时关闭以提高处理速度
# 使用 LLM 生成主题锚点，提高分块准确性，但会增加处理时间
enable_llm_anchor: false

# 锚点关键词数量 (可选，默认: 3)
# 每个文本块生成的主题锚点数量
anchor_keywords_count: 3

# ==================== Token 管理配置 (Token Management) ====================
# 性能配置项 - 控制 Token 使用和性能优化

# 最大 Prompt Token 数 (必填，默认: 6000)
# 单个请求的最大 Token 数量，影响处理速度和成本
max_prompt_tokens: 6000

# 启用 Token 监控 (可选，默认: true)
# 自动监控和报告 Token 使用情况，帮助优化配置
enable_token_monitoring: true

# ==================== QA 过滤配置 (QA Filtering Configuration) ====================
# 可选配置项 - 提高处理效率

# 新增语义分组配置
semantic_grouping:
  max_question_length: 50
  default_similarity_threshold: 0.65
  std_factor: 0.5 # 动态阈值计算中的标准差系数

# 新增长答案处理与风险控制配置
long_answer_processing:
  chain_summary_threshold: 3000 # 超过此长度启动链式摘要
  summary_length: 50
  nli_model_path: "cross-encoder/nli-deberta-v3-base" # 蕴含校验模型
  entailment_threshold: 0.7 # 蕴含分数阈值

# 已知问题前缀 (可选)
# 用于识别问题的关键词前缀，支持自定义添加
known_prefixes:
  # 中文常见前缀
  - "网友"
  - "记者"
  - "问"
  - "提问者"
  - "主持人"
  - "文章引用"
  - "Q"
  - "观众"
  - "评论"
  - "主持"
  - "用户"
  # 面试场景前缀
  - "面试官"
  - "嘉宾"
  # 英文前缀
  - "Q:"
  - "Question:"
  - "Interviewer:"
  - "Host:"

# ==================== 日志配置 (Logging Configuration) ====================
# 调试配置项 - 控制日志输出

# 日志级别 (可选，默认: INFO)
# 选项：DEBUG, INFO, WARNING, ERROR, CRITICAL
# DEBUG: 详细调试信息，INFO: 一般信息，WARNING: 警告，ERROR: 错误
log_level: "DEBUG"

# 启用成功日志 (可选，默认: true)
# 记录成功提取的 QA 对详细信息
enable_success_log: true

# 启用错误日志 (可选，默认: true)
# 记录处理失败的详细信息，用于调试
enable_error_log: true

# ==================== 性能优化配置 (Performance Optimization) ====================
# 批处理大小 (可选，默认: 5)
# 设置说明：
# batch_size = 1: 完全串行，最稳定，适合调试和对稳定性要求极高的场景
# batch_size = 3-5: 适中并发，平衡性能和稳定性，推荐大多数场景
# batch_size = 10+: 高并发，适合高性能服务器，需要充分测试
# 
# 重要：每个block的prompt长度不受batch_size影响！

batch_size: 4  # 🎯 

# 最大工作线程数 (可选，默认: 3)
# 建议设置：
# max_workers = 1: 严格串行，batch_size设为1时推荐
# max_workers = 2-3: 适中并发，适合普通服务器
# max_workers = 4+: 高并发，需要高性能Ollama服务器支持
max_workers: 3  # 🎯 

# 启用模型预热 (可选，默认: true)
# 🚀 暂时关闭模型预热以加快启动速度
# 在程序启动时预热模型，减少首次调用延迟
enable_model_warmup: false

# =============================================================================
# 环境变量支持 (Environment Variable Support)
# =============================================================================
# 以下配置项可通过环境变量覆盖：
# PDF_FILENAME, OUTPUT_FILENAME, OUTPUT_DIR
# OLLAMA_MODEL, OLLAMA_HOST, MODEL_TEMPERATURE
# MAX_BLOCK_SIZE, MIN_BLOCK_SIZE, EXTRACT_RATIO
# QA_ALLOWANCE_RATIO, ENABLE_SLIDING_CONTEXT, ENABLE_LLM_ANCHOR
# ANCHOR_KEYWORDS_COUNT, ENABLE_QA_FILTER, LOG_LEVEL
# =============================================================================
